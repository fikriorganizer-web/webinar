<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webinar Fikri Organizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      background: linear-gradient(120deg, #effbf3 0%, #e8f1fb 55%, #dde9fb 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 34px 16px;
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 575px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(30, 64, 120, 0.12);
      padding: 26px 24px 24px;
      text-align: center;
    }

    /* ===== LOGO ===== */
    .logo-wrap {
      display: inline-block;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
      padding: 6px 12px;
      margin-bottom: 20px;
    }
    .logo-wrap img {
      display: block;
      height: 72px;
      width: auto;
    }
    /* Cadangan jika file logo belum ada */
    .logo-fallback {
      display: none;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 1px;
      color: #222;
      padding: 10px 6px;
    }
    .logo-fallback span {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      letter-spacing: 3px;
      background: #f5b800;
      color: #222;
      padding: 2px 8px;
    }

    /* ===== JUDUL ===== */
    h1 {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.3;
      color: #111827;
      margin-bottom: 12px;
    }
    .sub {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.75;
      margin-bottom: 24px;
    }

    /* ===== TOMBOL ===== */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #edf3fe 0%, #dfe9fb 100%);
      box-shadow: 0 2px 5px rgba(30, 64, 120, 0.15);
      color: #1d4ed8;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(30, 64, 120, 0.20);
      background: linear-gradient(90deg, #e3ecfd 0%, #d2e1fa 100%);
    }
    .btn:active { transform: translateY(0); }

    footer {
      margin-top: 22px;
      font-size: 12px;
      color: #9ca3af;
    }

    /* ===== NOTIFIKASI ===== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #111827;
      color: #fff;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all .25s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      h1 { font-size: 17px; }
      .logo-wrap img { height: 60px; }
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="logo-wrap">
      <img src="logo-fikri.png" alt="Fikri Organizer"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
      <div class="logo-fallback">FIKRI ORGANIZER<span>SOLUSI EVENT ANDA</span></div>
    </div>

    <h1 id="judul"></h1>
    <p class="sub" id="subjudul"></p>

    <div class="links" id="links"></div>

    <footer>&copy; <span id="tahun"></span> Fikri Organizer</footer>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    /* =========================================================
       PENGATURAN — CUKUP UBAH BAGIAN INI SETIAP ADA ACARA BARU
       ========================================================= */
    const ACARA = {
      judul: "Webinar Nasional Deteksi Dini & Penanganan Kegawatdaruratan",
      subjudul: ["Fikri Organizer", "Sabtu, 28 November 2026"],
      tombol: [
        { teks: "Daftar Hadir", url: "https://forms.gle/GANTI_LINK_DAFTAR_HADIR" },
        { teks: "Zoom ID: 8614182 Pass: 004051", url: "https://zoom.us/j/8614182?pwd=GANTI",
          salin: "Zoom ID: 8614182\nPasscode: 004051" },
        { teks: "YouTube", url: "https://youtube.com/@GANTI_CHANNEL" },
        { teks: "Materi", url: "https://drive.google.com/GANTI_LINK_MATERI" },
      ],
    };
    /* ========================================================= */

    document.getElementById("judul").textContent = ACARA.judul;
    document.getElementById("subjudul").innerHTML = ACARA.subjudul.join("<br>");
    document.getElementById("tahun").textContent = new Date().getFullYear();
    document.title = ACARA.judul + " | Fikri Organizer";

    const wadah = document.getElementById("links");
    ACARA.tombol.forEach((t) => {
      const a = document.createElement("a");
      a.className = "btn";
      a.textContent = t.teks;
      a.href = t.url;
      a.target = "_blank";
      a.rel = "noopener";

      // Tombol Zoom: salin ID & passcode otomatis saat diklik
      if (t.salin) {
        a.addEventListener("click", () => {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(t.salin)
              .then(() => tampilkanToast("ID & Passcode Zoom disalin"))
              .catch(() => {});
          }
        });
      }
      wadah.appendChild(a);
    });

    function tampilkanToast(pesan) {
      const el = document.getElementById("toast");
      el.textContent = pesan;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2200);
    }
  </script>
</body>
</html>
